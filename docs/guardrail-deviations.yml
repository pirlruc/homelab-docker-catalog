deviations:
  - id: DOCKER-RUN-001
    why: >-
      GitLab Omnibus 18.11 and Pi-hole 2026.09 run as root. Their entrypoints
      fail when every capability is dropped. GitLab also cannot use a read-only
      root filesystem.
    epic: HDC-003
    owner: pirlruc
    review: 2026-12-31
  - id: DOCKER-COMPOSE-009
    why: >-
      cAdvisor mounts /var/run, /sys, / and /var/lib/docker read-only and adds
      SYS_ADMIN, which collecting host container stats requires; DAC_READ_SEARCH
      comes with the same image. It is the only service in the catalog that
      mounts /var/run, and it does not mount /var/run/docker.sock, which
      DOCKER-COMPOSE-009 otherwise treats as equivalent. Rootless BuildKit sets
      seccomp and AppArmor unconfined, which the upstream image requires. No
      application container mounts the Docker socket.
    epic: HDC-003
    owner: pirlruc
    review: 2026-12-31
    details: apps/cadvisor/compose.yaml
  - id: DOCKER-COMPOSE-006
    why: >-
      Pi-hole publishes DNS port 53 on the LAN address. Clients cannot use a
      resolver that is bound only to 127.0.0.1. The admin UI stays on loopback.
    epic: HDC-003
    owner: pirlruc
    review: 2026-12-31
  - id: DOCKER-LINT-003
    why: >-
      The iac job cannot validate a rendered configuration. container-iac runs
      "docker compose -f FILE config --quiet" with no env file and then passes
      the same entries to check-compose-gates.sh, which requires a path to an
      existing file. Every stack fails closed on a missing variable (${VAR:?})
      and .env stays out of the repository, so the job fails on every pull
      request, and the DOCKER-COMPOSE-001/002/005/006/007 gates that ride on the
      same step do not run in CI either. scripts/check-ci-local.sh still renders
      every stack with tests/*.env and KICS still scans apps/. containerdevops
      CDO-IAC-001 (issue #163) owns the fix.
    epic: HDC-006
    owner: pirlruc
    review: 2026-12-31
    details: .github/workflows/ci.yml
  - id: INFRA-DR-002
    why: >-
      stack_backup and vzdump both write to the machine they protect, so no copy
      leaves the host. The backup target is a consumer choice the operator has
      not made yet.
    epic: HFG-OFFSITE
    owner: pirlruc
    review: 2026-12-31
    details: docs/operations.md
  - id: INFRA-DR-003
    why: >-
      No restore has been run from any backup, because no guest is up yet. The
      first restore test is part of HFG-OFFSITE.
    epic: HFG-OFFSITE
    owner: pirlruc
    review: 2026-12-31
    details: docs/operations.md
  - id: INFRA-OBS-003
    why: >-
      Alertmanager routes to a default receiver with no integration, so an alert
      is accepted and dropped, and no alerting rules are loaded. No destination
      credentials exist yet.
    epic: HDC-005
    owner: pirlruc
    review: 2026-12-31
    details: docs/operations.md
