name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render every stack
        run: bash scripts/check-ci-local.sh

  smoke-light:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Boot Traefik and Vaultwarden
        run: |
          set -euo pipefail
          docker compose --env-file tests/reverse-proxy.env -f apps/reverse-proxy/compose.yaml up -d --wait
          docker compose --env-file tests/vaultwarden.env -f apps/vaultwarden/compose.yaml up -d --wait
      - name: Remove stacks
        if: always()
        run: |
          docker compose --env-file tests/reverse-proxy.env -f apps/reverse-proxy/compose.yaml down -v
          docker compose --env-file tests/vaultwarden.env -f apps/vaultwarden/compose.yaml down -v

  iac:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/containerdevops/.github/workflows/container-iac.yml@d524167752fd34f60326b07e10d6c400eb2fc9a7
    with:
      paths: apps
      compose_files: |
        apps/reverse-proxy/compose.yaml
        apps/dns-core/compose.yaml
        apps/vaultwarden/compose.yaml
        apps/gitlab-ce/compose.yaml
        apps/buildkit/compose.yaml
        apps/gitlab-mcp/compose.yaml
        apps/ollama/compose.yaml
        apps/defectdojo/compose.yaml
        apps/sonarqube-trivy/compose.yaml
        apps/observability/compose.yaml
        apps/cadvisor/compose.yaml
      kics_config: .github/kics.config
      scripts_ref: d524167752fd34f60326b07e10d6c400eb2fc9a7
      blocking: true
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}

  infra-lint:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@98549af765da30ca714a35de66842166f3a1488b
    with:
      shell_scripts: scripts/check-ci-local.sh
      run_shfmt: true
      scripts_ref: 98549af765da30ca714a35de66842166f3a1488b
      blocking: true
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  secrets:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@98549af765da30ca714a35de66842166f3a1488b
    with:
      scripts_ref: 98549af765da30ca714a35de66842166f3a1488b
      blocking: true
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@98549af765da30ca714a35de66842166f3a1488b
    with:
      scripts_ref: 98549af765da30ca714a35de66842166f3a1488b
      blocking: true
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  doc-verify:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@98549af765da30ca714a35de66842166f3a1488b
    with:
      run_link_lint: true
      run_markdownlint: true
      scripts_ref: 98549af765da30ca714a35de66842166f3a1488b
      blocking: true
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  # lychee reaches the network, so it stays advisory: a flaky upstream link must
  # not fail the gate. DOC-LINT-004 still reports it on every pull request.
  doc-links-live:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@98549af765da30ca714a35de66842166f3a1488b
    with:
      run_lychee: true
      scripts_ref: 98549af765da30ca714a35de66842166f3a1488b
      blocking: false
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
