name: sonarqube-trivy

services:
  db:
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 1g
    pids_limit: 256
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d sonar"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  sonarqube:
    image: sonarqube:26.9.0.129388-community@sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    pids_limit: 512
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - 127.0.0.1:9000:9000
    volumes:
      - data:/opt/sonarqube/data
      - extensions:/opt/sonarqube/extensions
      - logs:/opt/sonarqube/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9000/api/system/status | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  trivy:
    image: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: 1g
    pids_limit: 256
    command: ["server", "--listen", "0.0.0.0:4954"]
    ports:
      - 127.0.0.1:4954:4954
    volumes:
      - trivy-cache:/tmp/trivy
    environment:
      TRIVY_CACHE_DIR: /tmp/trivy
    healthcheck:
      test: ["CMD", "trivy", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db: {}
  data: {}
  extensions: {}
  logs: {}
  trivy-cache: {}
