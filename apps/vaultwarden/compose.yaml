name: vaultwarden

services:
  vaultwarden:
    image: vaultwarden/server:1.37.3-alpine@sha256:9a905c5cf5df61bb827da3805e160170741c0b53b0c63bb07e1afd3d2e21b1c8
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: 256m
    pids_limit: 128
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the https URL}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:?set SIGNUPS_ALLOWED true or false}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      ROCKET_ADDRESS: 0.0.0.0
      ROCKET_PORT: "80"
    ports:
      - 127.0.0.1:8081:80
    volumes:
      - data:/data
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data: {}
